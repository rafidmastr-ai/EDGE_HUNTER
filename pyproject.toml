[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-hunter"
version = "0.1.0"
description = "EDGE HUNTER — Technical Market Analysis & Signal Engine"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "httpx2>=2.0,<3.0",
    "playwright>=1.63,<2.0",
    "scikit-learn>=1.5,<2.0",
    "joblib>=1.4,<2.0",
]

[tool.unittest]
# Tests are executed with:
# python -m unittest discover -s tests -v
